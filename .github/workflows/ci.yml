name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # vitest and workerd (tests/workers/) run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Blocks a change that adds a critical or high advisory to
      # bun.lock and warns on moderate or low. Advisories main already
      # has are not this change's: the script compares against the base
      # commit. Named for Dependabot; it runs `bun audit`, which reads
      # the same GitHub advisory database Dependabot does.
      - name: dependabot
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$AUDIT_BASE_SHA"
          bun run security:advisories

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run check

      - name: Test
        run: bun test

      - name: Test on workerd
        run: bun run test:workers
